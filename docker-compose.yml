
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentconnect
      POSTGRES_USER: agentconnect
      POSTGRES_PASSWORD: local_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - agentconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentconnect -d agentconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentconnect_pgdata:
